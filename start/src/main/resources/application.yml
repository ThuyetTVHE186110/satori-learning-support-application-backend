server:
    port: ${APP_PORT:8080}

spring:
    application:
        name: satori-learning-platform

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}

    main:
        # Force servlet (WebMVC) mode even when spring-webflux is on the classpath.
        # The monitoring module uses WebClient (from webflux) as an HTTP client only —
        # it does NOT start a reactive web server. Without this, Spring Boot may
        # detect both starters and fail to resolve the application type.
        web-application-type: servlet

    # ==================== PostgreSQL Configuration ====================
    datasource:
        url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:satori_learning}?stringtype=unspecified
        username: ${POSTGRES_USER:satori_user}
        password: ${POSTGRES_PASSWORD:SatoriSecure2026!}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                show_sql: false
                format_sql: false
                dialect: org.hibernate.dialect.PostgreSQLDialect
                default_schema: user_management
        open-in-view: false

    # ==================== Redis Configuration ====================
    cache:
        type: redis
        redis:
            time-to-live: 3600000 # 1 hour
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:SatoriRedis2026!}
            timeout: 5000
            lettuce:
                pool:
                    max-active: 8
                    max-idle: 8
                    min-idle: 0

    # ==================== Jackson Configuration ====================
    jackson:
        deserialization:
            fail-on-unknown-properties: false

    # ==================== AI Configuration ====================
    ai:
        openai:
            api-key: ${OPENAI_API_KEY:}
            chat:
                options:
                    model: gpt-4o-mini
                    temperature: 0.7
                    max-tokens: 4096
            embedding:
                options:
                    model: text-embedding-3-large
                    dimensions: 1536
        # Retry config: extraction agents already handle their own retries via
        # ImportOrchestrator re-extraction loop, so keep Spring AI retry minimal.
        retry:
            max-attempts: 2
            backoff:
                initial-interval: 2000
                multiplier: 2
                max-interval: 10000

    # ==================== File Upload Configuration ====================
    servlet:
        multipart:
            enabled: true
            max-file-size: 100MB # Increased: PPTX with images can exceed 50 MB
            max-request-size: 110MB

# ==================== Japanese Learning Configuration ====================
learning:
    jlpt:
        levels:
            - N5
            - N4
            - N3
            - N2
            - N1

    session:
        max-messages-per-session: 100
        session-timeout-minutes: 60

    personalization:
        enabled: true
        recommendation-count: 10
        similarity-threshold: 0.7

# ==================== Application Security Configuration ====================
app:
    security:
        jwt:
            # Access token secret (at least 256 bits / 32 characters)
            access-token-secret: ${JWT_ACCESS_SECRET:SatoriAccessTokenSecret2026!VeryLongSecretKeyForJWT256Bits}
            # Refresh token secret (different from access token)
            refresh-token-secret: ${JWT_REFRESH_SECRET:SatoriRefreshTokenSecret2026!AnotherLongSecretKeyForJWT256}
            # Access token expiration: 30 minutes (1800000 ms)
            access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:1800000}
            # Refresh token expiration: 7 days (604800000 ms)
            refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
        # CORS allowed origins (comma-separated). Override per environment.
        # Production MUST set APP_ALLOWED_ORIGINS to the actual frontend URL.
        cors:
            allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
        # Swagger UI public access — true for local/dev, false for prod (application-prod.yml overrides)
        swagger:
            public: ${SWAGGER_PUBLIC:true}
        # Max failed login attempts before account lock
        max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
        # Account lock duration in minutes (reduced from 30 to 15 for better UX)
        lock-duration-minutes: ${LOCK_DURATION_MINUTES:5}
        # OTP expiration time in minutes
        otp-expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
        # Password reset token expiration in minutes
        reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:5}
        # Activation token expiration time in hours
        activation-token-expiration-hours: ${ACTIVATION_TOKEN_EXPIRATION_HOURS:24}
        # Per-IP rate limits for public auth endpoints
        rate-limits:
            login:
                max-requests: ${AUTH_RATE_LOGIN_MAX:10}
                window-minutes: ${AUTH_RATE_LOGIN_WINDOW:1}
            forgot-password:
                max-requests: ${AUTH_RATE_FORGOT_MAX:3}
                window-minutes: ${AUTH_RATE_FORGOT_WINDOW:10}
            verify-otp:
                max-requests: ${AUTH_RATE_OTP_MAX:5}
                window-minutes: ${AUTH_RATE_OTP_WINDOW:5}

    # Push Notification Configuration (FCM)
    notification:
        firebase:
            enabled: ${FCM_ENABLED:false}
            credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
            project-id: ${FIREBASE_PROJECT_ID:}
        cleanup:
            read-notification-retention-days: ${NOTIFICATION_READ_RETENTION_DAYS:30}
            all-notification-retention-days: ${NOTIFICATION_ALL_RETENTION_DAYS:90}
            inactive-token-retention-days: ${NOTIFICATION_TOKEN_RETENTION_DAYS:30}
        batch:
            max-batch-size: ${NOTIFICATION_BATCH_SIZE:500}
            batch-delay-ms: ${NOTIFICATION_BATCH_DELAY_MS:100}

    # Email Configuration (Resend HTTP API — no SMTP needed)
    email:
        enabled: ${EMAIL_ENABLED:true}
        resend-api-key: ${RESEND_API_KEY:}
        from: ${EMAIL_FROM:Satori Learning <noreply@satorinihongo.id.vn>}
        base-url: ${APP_BASE_URL:http://localhost:3000}

    # Cloudinary Configuration
    cloudinary:
        enabled: ${CLOUDINARY_ENABLED:true}
        cloud-name: ${CLOUDINARY_CLOUD_NAME:}
        api-key: ${CLOUDINARY_API_KEY:}
        api-secret: ${CLOUDINARY_API_SECRET:}

# ==================== Logging Configuration ====================
logging:
    level:
        root: INFO
        com.fu: DEBUG
        org.springframework.data.redis: DEBUG
        # Suppress Hibernate SQL noise (scheduler polls, retry queries, etc.)
        org.hibernate.SQL: WARN
        org.hibernate.orm.jdbc.bind: WARN

# ==================== Actuator Configuration ====================
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            show-details: always
            probes:
                enabled: true
        metrics:
            enabled: true
        info:
            enabled: true

# ==================== Curriculum Import - Agentic RAG Configuration ====================
curriculum-import:
    # ===== OCR Subsystem =====
    ocr:
        # Google Cloud Document AI Layout Parser for scanned PDF import.
        # Tier 2 fallback: GPT-4o Vision in VisionPageExtractor runs on rendered
        # page images for chunks Document AI cannot cover.
        # Set to false to disable OCR (scanned PDFs will be rejected).
        enabled: ${OCR_ENABLED:true}
        # DPI for rendering PDF pages to images.
        # 300 DPI = recommended for MnN scanned pages (furigana strokes preserved).
        # 150 DPI = fallback for memory-constrained environments.
        render-dpi: ${OCR_RENDER_DPI:300}
        # Chars-per-page below this → treated as scanned PDF (route to OCR)
        scanned-page-threshold: ${OCR_SCANNED_PAGE_THRESHOLD:100.0}
        # Minimum OCR confidence to accept (below = logged as low quality)
        min-confidence: ${OCR_MIN_CONFIDENCE:0.5}
        # Path to Google Cloud service-account JSON key used by Document AI.
        # If blank, uses GOOGLE_APPLICATION_CREDENTIALS env var (ADC).
        credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:environment/secrets/satori-489709-ce922a405186.json}

        # ===== Document AI Layout Parser =====
        # Requires a Layout Parser processor created in Google Cloud Console → Document AI.
        document-ai-enabled: ${DOCUMENT_AI_ENABLED:false}
        document-ai-project-id: ${DOCUMENT_AI_PROJECT_ID:703548005421}
        # Processor region — must be "us" or "eu" (Document AI has no global endpoint).
        document-ai-location: ${DOCUMENT_AI_LOCATION:us}
        document-ai-processor-id: ${DOCUMENT_AI_PROCESSOR_ID:}
        # Timeout in minutes for a single processDocument call.
        document-ai-timeout-minutes: ${DOCUMENT_AI_TIMEOUT_MINUTES:5}
        # ----- Semantic chunking (Layout Parser feature) -----
        # When enabled, Document AI returns document.chunked_document.chunks[]
        # — heading-aware pre-chunked text blocks suitable for direct RAG embedding.
        document-ai-chunking-enabled: ${DOCUMENT_AI_CHUNKING_ENABLED:true}
        # Target chunk size in tokens. 0 = use the Layout Parser default (~500).
        document-ai-chunk-size: ${DOCUMENT_AI_CHUNK_SIZE:500}
        # Prepend ancestor headings (e.g. "Bài 1 > Từ vựng") to each chunk's text.
        document-ai-include-ancestor-headings: ${DOCUMENT_AI_INCLUDE_ANCESTOR_HEADINGS:true}

    agentic-rag:
        # Minimum confidence for extraction (Corrective RAG threshold)
        confidence-threshold: ${RAG_CONFIDENCE_THRESHOLD:0.6}
        # Max re-extraction attempts per chunk
        max-re-extractions: ${RAG_MAX_RE_EXTRACTIONS:2}
        # Number of similar items for RAG context
        rag-top-k: ${RAG_TOP_K:5}
        # Minimum cosine similarity for RAG retrieval
        rag-similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.7}
        # Enable parallel chunk processing
        parallel-processing: ${RAG_PARALLEL_PROCESSING:true}
        # Max chunks per parallel batch (keep low on machines with <16 GB RAM)
        parallel-batch-size: ${RAG_PARALLEL_BATCH_SIZE:2}
        # Thread pool for import jobs (core / max / queue)
        thread-pool-core-size: ${RAG_THREAD_POOL_CORE:2}
        thread-pool-max-size: ${RAG_THREAD_POOL_MAX:4}
        thread-pool-queue-capacity: ${RAG_THREAD_POOL_QUEUE:50}
        # Enable embedding generation
        embedding-enabled: ${RAG_EMBEDDING_ENABLED:true}
        # Enable content validation step
        validation-enabled: ${RAG_VALIDATION_ENABLED:true}
        # Enable RAG context retrieval before extraction
        rag-retrieval-enabled: ${RAG_RETRIEVAL_ENABLED:true}
        # Retry scheduler delay (ms)
        retry-scheduler-delay-ms: ${RAG_RETRY_SCHEDULER_DELAY:30000}

        # ===== Self-Reflection (Self-RAG, Asai et al. 2023) =====
        # Disabled on first-import: reflection truncates source to 4000 chars then
        # fabricates "not in source" complaints on the truncated view, rejecting
        # canonical patterns that grounding verifier confirms at 100%. Kept as
        # opt-in for future telemetry via env override.
        self-reflection-enabled: ${RAG_SELF_REFLECTION_ENABLED:false}
        # Max source chars for reflection prompt (context window limit)
        self-reflection-max-source-chars: ${RAG_SELF_REFLECTION_MAX_SOURCE_CHARS:4000}

        # ===== Source Grounding Verification (CRAG anti-hallucination) =====
        # Enable grounding cross-reference check
        grounding-enabled: ${RAG_GROUNDING_ENABLED:true}
        # Min grounding confidence (below = flagged as hallucinated)
        grounding-threshold: ${RAG_GROUNDING_THRESHOLD:0.4}

        # ===== Combined Scoring Weights (must sum to 1.0) =====
        # With reflection disabled, grounding dominates. Rule-based is kept at
        # low weight until its scorer is audited (see task #16).
        rule-based-weight: ${RAG_RULE_BASED_WEIGHT:0.20}
        reflection-weight: ${RAG_REFLECTION_WEIGHT:0.00}
        grounding-weight: ${RAG_GROUNDING_WEIGHT:0.80}
        # Combined score below this triggers re-extraction
        combined-re-extraction-threshold: ${RAG_COMBINED_RE_EXTRACTION_THRESHOLD:0.5}

        # ===== Model & Agent Configuration =====
        # OpenAI model for per-section grammar/vocabulary extraction
        extraction-model: ${RAG_EXTRACTION_MODEL:gpt-4o}
        # OpenAI model for vision-based page extraction
        vision-model: ${RAG_VISION_MODEL:gpt-4o}
        # Minimum confidence for vision extraction results
        vision-confidence-threshold: ${RAG_VISION_CONFIDENCE:0.75}
        # Per-agent timeout in minutes
        agent-timeout-minutes: ${RAG_AGENT_TIMEOUT:4}
        # Estimated cost per token in USD (for cost estimation display)
        cost-per-token-usd: ${RAG_COST_PER_TOKEN:0.0000003}
        # Max concurrent LLM calls across all imports
        max-concurrent-llm-calls: ${RAG_MAX_CONCURRENT_LLM:6}
        # Per-batch timeout in minutes for parallel chunk processing
        batch-timeout-minutes: ${RAG_BATCH_TIMEOUT:15}
        # Minutes an import can stay in processing state before being considered stuck
        stuck-import-threshold-minutes: ${RAG_STUCK_THRESHOLD:120}

# ==================== Practice Module Configuration ====================
practice:
    llm-timeout-seconds: ${PRACTICE_LLM_TIMEOUT:120}
    rag-timeout-seconds: ${PRACTICE_RAG_TIMEOUT:3}
    anti-repeat-window-hours: ${PRACTICE_ANTI_REPEAT_HOURS:24}
    ema-alpha: ${PRACTICE_EMA_ALPHA:0.4}
    initial-ema: ${PRACTICE_INITIAL_EMA:0.5}
    mastery-thresholds: 0.40,0.70,0.90
    mastery-weights:
        accuracy: 0.30
        ema: 0.50
        streak: 0.20
    score-tiers:
        excellent: 80
        good: 60

# ==================== Conversation Module Configuration ====================
conversation:
    chat:
        # OpenAI model for the main CURRICULUM_QA response
        model: ${CHAT_MODEL:gpt-4o-mini}
        # Sampling temperature (0.0 = deterministic, 1.0 = creative)
        temperature: ${CHAT_TEMPERATURE:0.3}
        # Max tokens the model may generate per response
        max-response-tokens: ${CHAT_MAX_RESPONSE_TOKENS:1024}
        # Token budget for conversation history (leaves room for system prompt + RAG + question)
        max-history-tokens: ${CHAT_MAX_HISTORY_TOKENS:2000}
        # Per-user rate limit: max messages per window
        rate-limit-max-requests: ${CHAT_RATE_LIMIT_MAX_REQUESTS:20}
        # Duration of the rate-limit window in minutes
        rate-limit-window-minutes: ${CHAT_RATE_LIMIT_WINDOW_MINUTES:1}
        # Max messages to fetch from DB for conversation history
        max-db-messages: ${CHAT_MAX_DB_MESSAGES:40}
        # SSE timeout in milliseconds for streaming responses
        sse-timeout-ms: ${CHAT_SSE_TIMEOUT_MS:60000}
        # ACTIVE sessions older than this are marked ABANDONED by the nightly cleanup scheduler
        session-cleanup-retention-days: ${CHAT_SESSION_CLEANUP_RETENTION_DAYS:30}
    rag:
        # Enable Self-RAG relevance check advisor (order=200)
        relevance-check-enabled: ${CHAT_RAG_RELEVANCE_CHECK:true}
        # Min confidence threshold for relevance verdict to strip RAG context
        relevance-threshold: ${CHAT_RAG_RELEVANCE_THRESHOLD:0.5}
        # Enable CRAG grounding check advisor (order=300)
        grounding-check-enabled: ${CHAT_RAG_GROUNDING_CHECK:true}
        # Min confidence for grounding verdict to append disclaimer
        grounding-threshold: ${CHAT_RAG_GROUNDING_THRESHOLD:0.6}
        # Min cosine similarity for best retrieved item to be considered meaningful context
        min-meaningful-similarity: ${CHAT_RAG_MIN_SIMILARITY:0.50}
        # Per-intent overrides for the quality gate threshold (lower = more lenient retrieval)
        # LOOKUP: exact term match needs tighter control to avoid unrelated words
        # EXPLAIN: grammar explanations are verbose — cross-lingual score naturally lower
        # EXAMPLE: example/dialog queries use meta-language ("ví dụ") not Japanese text
        intent-thresholds:
            LOOKUP: ${CHAT_RAG_THRESHOLD_LOOKUP:0.55}
            EXPLAIN: ${CHAT_RAG_THRESHOLD_EXPLAIN:0.42}
            EXAMPLE: ${CHAT_RAG_THRESHOLD_EXAMPLE:0.35}
        # Model for lightweight advisor LLM calls (relevance + grounding checks)
        check-model: ${CHAT_RAG_CHECK_MODEL:gpt-4o-mini}
        # Max tokens for advisor check calls
        check-max-tokens: ${CHAT_RAG_CHECK_MAX_TOKENS:512}
        # Enable combined query analysis (intent + bilingual translation) before retrieval
        query-analysis-enabled: ${CHAT_RAG_QUERY_ANALYSIS:true}
        # Fallback bilingual query expansion when query-analysis-enabled=false
        bilingual-query-enabled: ${CHAT_RAG_BILINGUAL:true}
        # Enable hybrid retrieval (dense HNSW + sparse pg_trgm) with RRF fusion
        # Requires migration 49-bm25-hybrid-index.sql; disable if pg_trgm is not installed
        hybrid-enabled: ${CHAT_RAG_HYBRID_ENABLED:true}
        # Top-K results for vector retrieval
        retrieval-top-k: ${CHAT_RAG_RETRIEVAL_TOP_K:8}
        # Minimum cosine similarity floor for retrieval (below this, results are discarded)
        retrieval-similarity-floor: ${CHAT_RAG_RETRIEVAL_FLOOR:0.30}
        # Enable HyDE (Hypothetical Document Embeddings) for LOOKUP/EXPLAIN intents
        # Generates a short hypothetical curriculum entry before embedding → +5-15% cosine similarity
        hyde-enabled: ${CHAT_RAG_HYDE_ENABLED:true}
    intent-router:
        # Outermost advisor (order=5) — short-circuits off-topic queries via semantic
        # similarity against curated exemplars. Replaces the legacy regex-based
        # DomainScopeAdvisor. When disabled, the router no-ops and every query passes.
        enabled: ${CHAT_INTENT_ROUTER_ENABLED:true}
        # Minimum cosine similarity the best off-topic exemplar must hit before the
        # router will even consider refusing. Below this, the query resembles nothing
        # in the exemplar set — fail open rather than guess.
        min-off-topic-score: ${CHAT_INTENT_ROUTER_MIN_OFFTOPIC:0.50}
        # Required gap between the top off-topic and in-scope scores. Lesson-range
        # queries ("bài 1 + 2 có gì") sit very close to math exemplars in embedding
        # space, so a non-trivial margin is needed to tell them apart.
        margin: ${CHAT_INTENT_ROUTER_MARGIN:0.05}
        # LRU cache size for repeated queries (0 disables caching).
        cache-size: ${CHAT_INTENT_ROUTER_CACHE:256}
        # Classpath resource holding the curated exemplar set.
        exemplar-resource: ${CHAT_INTENT_ROUTER_EXEMPLARS:intent-exemplars.yml}

# ==================== Pronunciation Assessment ====================
# Provider priority: Azure > SpeechSuper (auto-selected by CompositePronunciationProvider)
pronunciation:
    azure:
        enabled: ${AZURE_SPEECH_ENABLED:false}
        subscription-key: ${AZURE_SPEECH_KEY:}
        region: ${AZURE_SPEECH_REGION:southeastasia}
        language: ${AZURE_SPEECH_LANGUAGE:ja-JP}
        timeout: ${AZURE_SPEECH_TIMEOUT:30000}
        granularity: PHONEME # FULL_TEXT | WORD | PHONEME
        tts:
            enabled: ${AZURE_TTS_ENABLED:true}
            default-voice: ${AZURE_TTS_DEFAULT_VOICE:ja-JP-NanamiNeural}
            output-format: ${AZURE_TTS_OUTPUT_FORMAT:Audio16Khz32KBitRateMonoMp3}
            bundle-timeout-ms: ${AZURE_TTS_BUNDLE_TIMEOUT_MS:10000}
    speechsuper:
        app-key: ${SPEECHSUPER_APP_KEY:}
        secret-key: ${SPEECHSUPER_SECRET_KEY:}
        base-url: ${SPEECHSUPER_BASE_URL:https://api.speechsuper.com}
        timeout: ${SPEECHSUPER_TIMEOUT:30000}

# ==================== Roleplay Module Configuration ====================
roleplay:
    max-messages: ${ROLEPLAY_MAX_MESSAGES:50}
    max-active-sessions: ${ROLEPLAY_MAX_ACTIVE_SESSIONS:3}
    # AI model for roleplay conversation
    model-name: ${ROLEPLAY_MODEL:gpt-4.1-mini}
    # AI model for evaluation (mission + session)
    evaluator-model: ${ROLEPLAY_EVALUATOR_MODEL:gpt-4.1-mini}
    # Redis session TTL in hours
    redis-session-ttl-hours: ${ROLEPLAY_REDIS_TTL:2}
    # Max context messages for AI conversation
    max-context-messages: ${ROLEPLAY_MAX_CONTEXT:20}
    # Max messages for evaluation input
    max-eval-messages: ${ROLEPLAY_MAX_EVAL:20}
    # Max audio file size in MB
    max-audio-size-mb: ${ROLEPLAY_MAX_AUDIO_MB:10}
    scoring:
        mission-weight: ${ROLEPLAY_MISSION_WEIGHT:0.35}
        pronunciation-weight: ${ROLEPLAY_PRONUNCIATION_WEIGHT:0.30}
        language-weight: ${ROLEPLAY_LANGUAGE_WEIGHT:0.35}
    evaluation-weights:
        accuracy: 0.30
        pronunciation: 0.25
        task-completion: 0.30
        complexity: 0.15

version: "3.8"

# Docker Compose for Production with Application
services:
    # ==================== Application ====================
    app:
        build:
            context: ..
            dockerfile: Dockerfile
        container_name: satori-app
        restart: unless-stopped
        environment:
            - SPRING_PROFILES_ACTIVE=prod
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=satori_learning
            - POSTGRES_USER=satori_user
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-SatoriSecure2026!}
            - MONGO_HOST=mongodb
            - MONGO_PORT=27017
            - MONGO_DB=satori_conversations
            - MONGO_USER=satori_app
            - MONGO_PASSWORD=SatoriApp2026!
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-SatoriRedis2026!}
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - JWT_SECRET=${JWT_SECRET}
        ports:
            - "8080:8080"
        networks:
            - satori-network
        depends_on:
            postgres:
                condition: service_healthy
            mongodb:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "--spider",
                    "http://localhost:8080/actuator/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    # ==================== PostgreSQL ====================
    postgres:
        image: pgvector/pgvector:pg16
        container_name: satori-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: satori_learning
            POSTGRES_USER: satori_user
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SatoriSecure2026!}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/init-scripts/postgres:/docker-entrypoint-initdb.d
        networks:
            - satori-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U satori_user -d satori_learning"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ==================== MongoDB ====================
    mongodb:
        image: mongo:7.0
        container_name: satori-mongodb
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: satori_admin
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-SatoriMongo2026!}
            MONGO_INITDB_DATABASE: satori_conversations
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db
            - ./docker/init-scripts/mongo:/docker-entrypoint-initdb.d
        networks:
            - satori-network
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ==================== Redis ====================
    redis:
        image: redis:7.2-alpine
        container_name: satori-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-SatoriRedis2026!}
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - satori-network
        healthcheck:
            test:
                [
                    "CMD",
                    "redis-cli",
                    "-a",
                    "${REDIS_PASSWORD:-SatoriRedis2026!}",
                    "ping",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    satori-network:
        driver: bridge

volumes:
    postgres_data:
        name: satori-postgres-data
    mongodb_data:
        name: satori-mongodb-data
    redis_data:
        name: satori-redis-data

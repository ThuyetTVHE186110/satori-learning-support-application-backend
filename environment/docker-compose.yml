services:
    # ==================== PostgreSQL ====================
    # Main database for all structured data (users, lessons, AI conversations via JSONB)
    postgres:
        image: pgvector/pgvector:pg16
        container_name: satori-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: satori_learning
            POSTGRES_USER: satori_user
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SatoriSecure2026!}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/init-scripts/postgres:/docker-entrypoint-initdb.d
        networks:
            - satori-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U satori_user -d satori_learning"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ==================== Redis ====================
    # For caching, session management, AI response caching
    redis:
        image: redis:7.2-alpine
        container_name: satori-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-SatoriRedis2026!}
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - satori-network
        healthcheck:
            test:
                [
                    "CMD",
                    "redis-cli",
                    "-a",
                    "${REDIS_PASSWORD:-SatoriRedis2026!}",
                    "ping",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    # ==================== Adminer ====================
    # Database management UI
    adminer:
        image: adminer:latest
        container_name: satori-adminer
        restart: unless-stopped
        ports:
            - "8081:8080"
        networks:
            - satori-network
        depends_on:
            - postgres

    # ==================== Redis Commander ====================
    # Redis management UI
    redis-commander:
        image: rediscommander/redis-commander:latest
        container_name: satori-redis-commander
        restart: unless-stopped
        environment:
            REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-SatoriRedis2026!}
        ports:
            - "8083:8081"
        networks:
            - satori-network
        depends_on:
            - redis

    # ==================== PaddleOCR Microservice ====================
    # Dual-language OCR for Japanese + Vietnamese text extraction (PaddleOCR 3.0)
    # Built from environment/docker/ocr-service/
    # First start downloads both model weights (~3-5 min); subsequent starts
    # are fast because weights are cached in the named volume below.
    ocr-service:
        build:
            context: ./docker/ocr-service
            dockerfile: Dockerfile
        container_name: satori-ocr
        restart: unless-stopped
        ports:
            - "8090:8090"
        volumes:
            # Persist downloaded model weights across container restarts
            - ocr_model_cache:/root/.paddleocr
        networks:
            - satori-network
        # OCR is CPU-heavy; cap resources so other services aren't starved
        # 4G needed for two PaddleOCR models (japan + vi) loaded simultaneously
        deploy:
            resources:
                limits:
                    memory: 4G
                    cpus: "2.0"
                reservations:
                    memory: 1.5G
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost:8090/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 240s # Allow time for dual model download on first start

    # ==================== Japanese Pronunciation Assessment Microservice ====================
    # Assesses pitch accent and mora timing for Japanese speech using pyopenjtalk + librosa.
    # First build installs pyopenjtalk (compiles from source, ~3-5 min); subsequent starts are fast.
    jp-pronunciation:
        build:
            context: ./docker/jp-pronunciation-service
            dockerfile: Dockerfile
        container_name: satori-jp-pronunciation
        restart: unless-stopped
        ports:
            - "8091:8091"
        networks:
            - satori-network
        deploy:
            resources:
                limits:
                    memory: 2G
                    cpus: "2.0"
                reservations:
                    memory: 512M
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8091/health'')" || exit 1',
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

networks:
    satori-network:
        driver: bridge

volumes:
    postgres_data:
        name: satori-postgres-data
    redis_data:
        name: satori-redis-data
    ocr_model_cache:
        name: satori-ocr-model-cache
        # Stores PaddleOCR Japanese + Vietnamese model weights (~600 MB).
        # Remove with: docker volume rm satori-ocr-model-cache

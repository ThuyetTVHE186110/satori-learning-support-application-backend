name: UAT Deploy

on:
    workflow_dispatch:
        inputs:
            reset_data:
                description: 'Reset UAT database (WARNING: deletes all UAT data)'
                required: false
                default: 'false'
                type: choice
                options: [ 'false', 'true' ]

jobs:
    build:
        name: Build JAR
        runs-on: ubuntu-latest
        outputs:
            jar_name: ${{ steps.jar_name.outputs.name }}

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

            - name: Run unit tests before deploy
              run: mvn test -DskipITs --no-transfer-progress

            - name: Build JAR
              run: mvn clean package -DskipTests --no-transfer-progress

            - name: Resolve JAR filename
              id: jar_name
              run: echo "name=$(ls start/target/*.jar | head -1 | xargs basename)" >> $GITHUB_OUTPUT

            - name: Upload JAR artifact
              uses: actions/upload-artifact@v4
              with:
                  name: uat-jar
                  path: start/target/*.jar
                  retention-days: 3

    deploy:
        name: Deploy to UAT
        runs-on: ubuntu-latest
        needs: build
        environment: uat

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Download JAR artifact
              uses: actions/download-artifact@v4
              with:
                  name: uat-jar
                  path: dist/

            # ── Reset DB if requested ──────────────────────────────────────
            - name: Reset UAT database volumes
              if: ${{ github.event.inputs.reset_data == 'true' }}
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.UAT_SERVER_HOST }}
                  username: ${{ secrets.UAT_SERVER_USER }}
                  key: ${{ secrets.UAT_SSH_KEY }}
                  script: |
                      cd /opt/satori/uat
                      docker compose -f docker-compose.uat.yml down -v
                      echo "UAT volumes cleared"

            # ── Start infrastructure ───────────────────────────────────────
            - name: Copy docker-compose.uat.yml to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.UAT_SERVER_HOST }}
                  username: ${{ secrets.UAT_SERVER_USER }}
                  key: ${{ secrets.UAT_SSH_KEY }}
                  source: "environment/docker-compose.uat.yml,environment/docker/init-scripts/"
                  target: /opt/satori/uat/

            - name: Start UAT infrastructure
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.UAT_SERVER_HOST }}
                  username: ${{ secrets.UAT_SERVER_USER }}
                  key: ${{ secrets.UAT_SSH_KEY }}
                  script: |
                      cd /opt/satori/uat/environment
                      POSTGRES_UAT_PASSWORD=${{ secrets.POSTGRES_UAT_PASSWORD }} \
                      REDIS_UAT_PASSWORD=${{ secrets.REDIS_UAT_PASSWORD }} \
                      docker compose -f docker-compose.uat.yml up -d --wait
                      echo "Infrastructure started"

            # ── Deploy application ─────────────────────────────────────────
            - name: Copy JAR to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.UAT_SERVER_HOST }}
                  username: ${{ secrets.UAT_SERVER_USER }}
                  key: ${{ secrets.UAT_SSH_KEY }}
                  source: dist/*.jar
                  target: /opt/satori/uat/app/

            - name: Restart application
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.UAT_SERVER_HOST }}
                  username: ${{ secrets.UAT_SERVER_USER }}
                  key: ${{ secrets.UAT_SSH_KEY }}
                  script: |
                      # Stop existing app
                      pkill -f 'satori.*jar' || true
                      sleep 3

                      # Start new version
                      export SPRING_PROFILES_ACTIVE=uat
                      export POSTGRES_HOST=localhost
                      export POSTGRES_PORT=5434
                      export POSTGRES_DB=satori_uat
                      export POSTGRES_USER=satori_user
                      export POSTGRES_PASSWORD=${{ secrets.POSTGRES_UAT_PASSWORD }}
                      export REDIS_HOST=localhost
                      export REDIS_PORT=6381
                      export REDIS_PASSWORD=${{ secrets.REDIS_UAT_PASSWORD }}
                      export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                      export JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
                      export JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
                      export EMAIL_ENABLED=false

                      nohup java -jar /opt/satori/uat/app/*.jar \
                        --spring.profiles.active=uat \
                        > /opt/satori/uat/app/satori-uat.log 2>&1 &

                      echo "Application starting in background (PID: $!)"
                      echo "Logs: /opt/satori/uat/app/satori-uat.log"

            # ── Health check ───────────────────────────────────────────────
            - name: Health check
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.UAT_SERVER_HOST }}
                  username: ${{ secrets.UAT_SERVER_USER }}
                  key: ${{ secrets.UAT_SSH_KEY }}
                  script: |
                      echo "Waiting for application to start..."
                      for i in $(seq 1 24); do
                        STATUS=$(curl -sf http://localhost:8080/actuator/health \
                                 -H "Accept: application/json" | grep -o '"status":"[A-Z]*"' | head -1 || true)
                        if [ "$STATUS" = '"status":"UP"' ]; then
                          echo "UAT application is UP after $((i * 5))s"
                          exit 0
                        fi
                        echo "  attempt $i/24 — not ready yet"
                        sleep 5
                      done
                      echo "Health check TIMED OUT"
                      exit 1

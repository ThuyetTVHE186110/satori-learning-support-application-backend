# =============================================================================
# Assignment Module Test Configuration
# =============================================================================
# Extends shared test database + Redis config (via application-test.yml inheritance)
# 
# For AI Response Schema Validation Tests:
# 1. Set environment variable: OPENAI_API_KEY=sk-...
# 2. Tests with @EnabledIf("#{environment['OPENAI_API_KEY'] != null}") will run
# 3. Tests will call REAL OpenAI API and validate response schema
# 
# Without API key: Tests are skipped (not failed)
# =============================================================================

spring:
    ai:
        openai:
            api-key: ${OPENAI_API_KEY:test-dummy-key}  # Falls back to dummy if env var not set
            chat:
                options:
                    model: gpt-4o-mini
                    temperature: 0.7
                    max-tokens: 2000
            embedding:
                options:
                    model: text-embedding-3-small

# Only log when we detect a real API key
logging:
    level:
        com.fu.assignment.ai: DEBUG
        org.springframework.ai.openai: WARN


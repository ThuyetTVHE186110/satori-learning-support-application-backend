# =============================================================================
# Test Configuration — PostgreSQL satori_test database
# =============================================================================
# Used for:
#   - Unit tests (@ExtendWith(MockitoExtension)): DB not touched
#   - Integration tests (@SpringBootTest): connects to satori_test
#
# Setup (one-time):
#   docker exec satori-postgres psql -U satori_user -d satori_learning \
#     -c "CREATE DATABASE satori_test OWNER satori_user;"
#   (enum types and schemas are created automatically via ddl-auto=create-drop)
# =============================================================================

spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/satori_test
        driver-class-name: org.postgresql.Driver
        username: satori_user
        password: SatoriSecure2026!

    jpa:
        hibernate:
            ddl-auto: create-drop       # creates schema on startup, drops on shutdown
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false
        open-in-view: false

    # Redis — use the same satori-redis container, caching disabled for tests
    data:
        redis:
            host: localhost
            port: 6379
            password: SatoriRedis2026!
            timeout: 5000
            repositories:
                enabled: false

    cache:
        type: none

    # Spring AI — provide a placeholder key so OpenAiAutoConfiguration doesn't fail
    # Auth integration tests don't call AI endpoints; this just satisfies the bean creation
    ai:
        openai:
            api-key: test-dummy-key-not-used
            chat:
                options:
                    model: gpt-4o-mini
            embedding:
                options:
                    model: text-embedding-3-small

# JWT — reuse default secrets so JwtService can sign/verify tokens normally
app:
    security:
        jwt:
            access-token-secret: SatoriAccessTokenSecret2026!VeryLongSecretKeyForJWT256Bits
            refresh-token-secret: SatoriRefreshTokenSecret2026!AnotherLongSecretKeyForJWT256
            access-token-expiration-ms: 1800000
            refresh-token-expiration-ms: 604800000
        # Very high rate limits for testing (or effectively disable)
        max-failed-attempts: 1000
        lock-duration-minutes: 1
        otp-expiration-minutes: 10
        rate-limits:
            login:
                max-requests: 10000
                window-minutes: 1
            forgot-password:
                max-requests: 10000
                window-minutes: 1
            register:
                max-requests: 10000
                window-minutes: 1
            verify-otp:
                max-requests: 10000
                window-minutes: 1

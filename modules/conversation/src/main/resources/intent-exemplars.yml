# Curated exemplars for semantic intent routing.
#
# The IntentClassifier embeds every string below once at startup, then for
# each incoming user query it computes cosine similarity against all exemplars
# and aggregates the per-category top-1 score. If the best off-topic category
# beats the best in-scope category by more than the configured margin, the
# query is short-circuited with a canned refusal.
#
# Rules when curating:
#   • Keep each list tight (15–25 items) — more exemplars = more noise, not more accuracy.
#   • Include multilingual variants (VI / JA / EN) because users mix freely.
#   • "in-scope" exemplars are the guard-rails that keep legitimate Japanese-learning
#     queries from being misclassified (especially lesson-range queries like "bài 1 + 2").
#   • Do NOT add a catch-all "off_topic_other" — it drifts toward matching anything.

off-topic:
  math:
    - "1+1 bằng mấy"
    - "1+1=?"
    - "tính 123 + 456"
    - "3 * 4 bằng bao nhiêu"
    - "12×5 = ?"
    - "100 chia 4"
    - "giải phương trình x^2 + 3x + 2 = 0"

# =============================================================================
# Base application.yml for conversation module integration tests.
#
# WHY THIS FILE EXISTS:
#   IntelliJ adds start/target/classes to the test classpath (transitive project
#   deps), which puts start's application.yml on the classpath. That file does NOT
#   contain app.security.jwt.* keys (it uses ${JWT_ACCESS_SECRET:...} env vars).
#   When Spring Boot finds that file first it wins, and application-test.yml
#   profile overlay still runs BUT the base placeholder resolution for @Value
#   in JwtService happens before the overlay — causing
#   "Could not resolve placeholder 'app.security.jwt.access-token-secret'".
#
#   Placing a complete application.yml here (in test/resources, which is first
#   on the classpath) ensures THIS file is loaded as the base config, not the
#   start module's one.
# =============================================================================

spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/satori_test
        driver-class-name: org.postgresql.Driver
        username: satori_user
        password: SatoriSecure2026!

    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false
        open-in-view: false

    data:
        redis:
            host: localhost
            port: 6379
            password: SatoriRedis2026!
            timeout: 5000
            repositories:
                enabled: false

    cache:
        type: none


    ai:
        openai:
            api-key: test-dummy-key-not-used
            chat:
                options:
                    model: gpt-4o-mini
            embedding:
                options:
                    model: text-embedding-3-small

app:
    email:
        enabled: false
    security:
        jwt:
            access-token-secret: SatoriAccessTokenSecret2026!VeryLongSecretKeyForJWT256Bits
            refresh-token-secret: SatoriRefreshTokenSecret2026!AnotherLongSecretKeyForJWT256
            access-token-expiration-ms: 1800000
            refresh-token-expiration-ms: 604800000
